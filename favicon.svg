<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Dark background -->
  <rect width="32" height="32" fill="#080808"/>
  <!-- Lime accent corner marks -->
  <rect x="0" y="0" width="3" height="3" fill="#c8f73e"/>
  <rect x="29" y="29" width="3" height="3" fill="#c8f73e"/>
  <!-- "A" letterform built from geometric lines matching Unbounded weight -->
  <!-- Left leg -->
  <rect x="7" y="8" width="3.5" height="17" fill="#f0ede8"/>
  <!-- Right leg -->
  <rect x="21.5" y="8" width="3.5" height="17" fill="#f0ede8"/>
  <!-- Top bar (roof of A) -->
  <rect x="7" y="8" width="18" height="3.5" fill="#f0ede8"/>
  <!-- Crossbar — lime coloured -->
  <rect x="7" y="17" width="18" height="3" fill="#c8f73e"/>
</svg>
